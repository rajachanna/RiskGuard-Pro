[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "riskguard-pro"
version = "0.1.0"
description = "Explainable, fail-closed pre-trade risk review for synthetic portfolios"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Raja Channa / NextGen Tech Solutions"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["riskguard"]

[tool.setuptools.package-data]
riskguard = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
